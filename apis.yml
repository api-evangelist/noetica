name: Noetica
description: 'Noetica AI is a New York-based legal and financial market-intelligence
  platform that uses natural language processing and a proprietary knowledge graph
  to extract, benchmark, and analyze deal terms from millions of public and private
  transactions. It serves transactional attorneys, capital-markets and M&A lawyers,
  credit and private-lending professionals, and legal-innovation teams at leading
  global law firms, delivering real-time quantitative and qualitative benchmarking
  across 60+ transaction types. Backed by Lightspeed Venture Partners and Thomson
  Reuters Ventures. As of this profiling Noetica exposes no public API, developer
  portal, SDKs, documentation, or /.well-known discovery surface; it operates as an
  enterprise B2B SaaS platform.'
